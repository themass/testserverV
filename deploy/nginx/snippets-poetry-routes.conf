# /etc/nginx/snippets/poetry-routes.conf
# 唐诗产品学生端站点（poetry.ok123find.top）专用 = API 段 + 静态段。
# api.ok123find.top 侧只 include snippets/poetry-api.conf，绝不 include 本文件
# ——否则 api. 域名的 location / 会被 SPA 回退抢走。

include /etc/nginx/snippets/poetry-api.conf;

# ---------------------------------------------------------------------------
# 学生端 PWA 静态站（vite build 产物，sw.js 在根）。
# root 固定 /home/file/poetry/current/dist——current 是发布脚本翻的软链，
# 回滚 = 软链指回上一版，nginx 不用动。
# ---------------------------------------------------------------------------

# Service Worker 与其作用域内的资源绝不缓存——PWA 更新的第一杀手是缓存的旧 sw。
location = /sw.js {
    root /home/file/poetry/current/dist;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
}

# 带内容哈希的构建产物可以长缓存（文件名变了自然失效）。
location ^~ /assets/ {
    root /home/file/poetry/current/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# SPA 回退：先找文件，再找目录，都没有就回 index.html（同样不缓存，保证发版即见）。
location / {
    root /home/file/poetry/current/dist;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
