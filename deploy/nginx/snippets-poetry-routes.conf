# /etc/nginx/snippets/poetry-routes.conf
# poetry.sspacee.com 的路由：静态 PWA（网关本机磁盘）+ 同源 API（反代 vpn_server）
# 由 poetry-gateway.conf 的 80/443 两个 server 块 include。
#
# ⚠ 与旧版（poetry-routes-sspacee.conf，应用机版）的两处不同，都是拓扑决定的：
#   1. **静态根在网关本机磁盘**：页面文件必须上传到 8.217.122.83 的 /home/file/poetry，
#      不是应用机。jar 那边 `student.app.root` 指的 /app/ 仍然在（8888 直连可用），
#      但公网走的是这里——因为 PWA 用了绝对路径（/sw.js、/manifest.webmanifest、
#      apiBase '/api/student/v1'），不能挂在 /app/ 前缀下。
#   2. **/assets/ 反代而不是读盘**：场景素材的内容寻址文件在**应用机**（`student.asset.root`），
#      网关上没有那份目录，所以由 jar 的 /assets/** 提供。素材在 bundle 里按 URI 命名，
#      走同源正好，不用改前端。
#
# API 前缀是后端实测的 @RequestMapping，**不带 /vvv、不 rewrite**（jar 无 context-path）。
# 前端禁止写死域名，一律走同源相对路径——所以这个域名单独上线时前端零改动。

# ---------- 静态 PWA（root 恒指 current/dist，回滚只翻软链，nginx 不动） ----------
location = /sw.js {
    root /home/file/poetry/current/dist;
    add_header Cache-Control "no-store" always;
}

location = /manifest.webmanifest {
    root /home/file/poetry/current/dist;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location = /icon.svg {
    root /home/file/poetry/current/dist;
    add_header Cache-Control "no-cache" always;
}

# 素材在应用机（jar 的 student.asset.root），所以代理而不是读本地盘。
# 素材 URI 由 bundle 内容寻址，可以一年 immutable。
location /assets/ {
    proxy_pass http://vpn_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

location / {
    root /home/file/poetry/current/dist;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

# ---------- 同源 API（同一个 jar，8888） ----------
# 学生端读接口：允许短缓存（config/timeline 这类），写侧与 lesson 各自 no-store 由后端头决定。
location ^~ /api/student/v1/ {
    proxy_pass http://vpn_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 10m;
}

location ^~ /api/poetry/v1/ {
    proxy_pass http://vpn_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 读接口永不缓存；SSE 流必须关缓冲
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}

# 讲诗 agent（student_agent，应用机 :8765）——**目前线上没有这个进程**，所以整段先注释。
# 前端 agentBase 默认 '/agent/v1'，同源即指这里；起进程时把下面 location 与
# 上游 student_agent_server 一起放开（上游要写在 nginx.conf 的 http {} 里）。
# 注意 :8765 默认绑 127.0.0.1 且 STUDENT_AGENT_AUTH 必须设成 java，否则它自己拒启
# （config.py 里那条 loopback 断言），跨机反代要先把监听与鉴权配好。
# location ^~ /agent/v1/ {
#     proxy_pass http://student_agent_server;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_buffering off;          # 讲诗是流式的
#     proxy_read_timeout 300s;
# }

# 网关自己的兜底不该漏进来：这个 vhost 只服务唐诗 PWA。
location ^~ /vvv/ {
    return 404;
}
