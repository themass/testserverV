# /etc/nginx/snippets/vpn-routes.conf
# 路由（由 80 与 443 两个 server 块共用）

client_max_body_size 20m;
gzip on;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 1024;

# 公共代理参数：放在 snippets/proxy-common.conf 里复用
include /etc/nginx/snippets/proxy-common.conf;

# 通用 API：只对 /vvv 下的接口返回 JSON 默认类型
location /vvv/ {
    default_type application/json;
    expires -1;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://vpn_server;
}

# 视频条目
location = /vvv/api/video/item {
    default_type application/json;
    expires -1;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://fetchurl_server;
}

# AI 文件 / OCR / 本地模型：精确或前缀匹配，优先于 /vvv/api/chat
location = /vvv/api/chat/ai/file.json {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}
location = /vvv/api/chat/ai/ocr.json {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}
location ^~ /vvv/api/chat/ai/local {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}

# 聊天接口：可能是流式输出，关闭缓冲，保证逐字返回
location ^~ /vvv/api/chat {
    default_type application/json;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server;
}

# 陪伴 / agent 服务（companion-agent，Python）。
# 注意：客户端直接请求 /companion/... 和 /api/agent/v1/...，**没有 /vvv 前缀**，
# 所以这里不 rewrite，原样转给 Python 服务（它自己就是这两个前缀）。
# 上游 companion_server 要在 nginx.conf 的 http {} 里定义，见 deploy/README.md。
# SSE（/api/agent/v1/sessions/{id}/events）必须关缓冲，否则流式回复会攒到最后一次性吐出。
location ^~ /api/agent/v1/ {
    default_type application/json;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://companion_server;
}
location ^~ /companion/ {
    default_type application/json;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://companion_server;
}

location ^~ /vvv/api/test {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server;
}

location ^~ /BookManager {
    proxy_pass http://book_server;
}

# 静态文件
location ^~ /file/ {
    alias /home/file/html/;
}
location ^~ /image/ {
    alias /home/web/webroot/files/;
}
location ^~ /soft {
    alias /home/file/soft;
}
location = /favicon.ico {
    return 404;
}

# 根路径：站点首页
location / {
    alias /home/file/html/;
    try_files $uri $uri/ =404;
}
