# /etc/nginx/snippets/vpn-routes.conf
# 路由（由 80 与 443 两个 server 块共用）

client_max_body_size 20m;
gzip on;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 1024;

# 公共代理参数：放在 snippets/proxy-common.conf 里复用
include /etc/nginx/snippets/proxy-common.conf;

# 通用 API：只对 /vvv 下的接口返回 JSON 默认类型
location /vvv/ {
    default_type application/json;
    expires -1;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://vpn_server;
}

# 飞机对决游戏（vvv-game 库模块，随 vvv-link 8888 装载，game.enabled=true 才有路由）。
# 线上入口统一带 /vvv 前缀（同本站其它 API），rewrite 剥前缀后转发；后端路径本就是 /api/game/**。
# 实测记录（2026-11-22）：/vvv/api/game/v1/** 已被上面的 location /vvv/ 兜住能通，
# 但 WS 握手必须 1.1 + Upgrade 透传，走不到那个通用块——所以这里两个 ^~ 精确块必须在最前。
# WS：读超时给到分钟级（应用层心跳 25s，这里只是兜底）。
location ^~ /vvv/api/game/ws {
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://vpn_server;
}

# HTTP 读接口（/vvv/api/game/v1/**）：普通转发。
location ^~ /vvv/api/game/v1/ {
    default_type application/json;
    expires -1;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://vpn_server;
}

# 视频条目
location = /vvv/api/video/item {
    default_type application/json;
    expires -1;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://fetchurl_server;
}

# AI 文件 / OCR / 本地模型：精确或前缀匹配，优先于 /vvv/api/chat
location = /vvv/api/chat/ai/file.json {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}
location = /vvv/api/chat/ai/ocr.json {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}
location ^~ /vvv/api/chat/ai/local {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server1;
}

# 聊天接口：可能是流式输出，关闭缓冲，保证逐字返回
location ^~ /vvv/api/chat {
    default_type application/json;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server;
}

# 陪伴 / agent 服务（companion-agent，Python）。
# 注意：客户端直接请求 /companion/... 和 /api/agent/v1/...，**没有 /vvv 前缀**，
# 所以这里不 rewrite，原样转给 Python 服务（它自己就是这两个前缀）。
# 上游 companion_server 要在 nginx.conf 的 http {} 里定义，见 deploy/README.md。
# SSE（/api/agent/v1/sessions/{id}/events）必须关缓冲，否则流式回复会攒到最后一次性吐出。
location ^~ /api/agent/v1/ {
    default_type application/json;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://companion_server;
}
location ^~ /companion/ {
    default_type application/json;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://companion_server;
}

location ^~ /vvv/api/test {
    default_type application/json;
    rewrite ^/vvv(/.*)$ $1 break;
    proxy_pass http://chat_server;
}

location ^~ /BookManager {
    proxy_pass http://book_server;
}

# 唐诗产品 API 过渡别名（域名已定版 sspacee.com 系，见 README「唐诗产品上线」；
# 本段 = 旧 snippets-poetry-api.conf 就地内联，稳定后整段移除）。
# 静态与 SPA 回退在 poetry.sspacee.com 域名上（应用机 nginx），这里只反代 API。
location ^~ /api/student/v1/ {
    proxy_pass http://vpn_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 10m;
}

location ^~ /api/poetry/v1/ {
    proxy_pass http://vpn_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}

# 静态文件
location ^~ /file/ {
    alias /home/file/html/;
}
location ^~ /image/ {
    alias /home/web/webroot/files/;
}
location ^~ /soft {
    alias /home/file/soft;
}
location = /favicon.ico {
    return 404;
}

# 根路径：站点首页
location / {
    alias /home/file/html/;
    try_files $uri $uri/ =404;
}
