# /etc/nginx/conf.d/poetry.conf
# poetry.ok123find.top —— 唐诗产品学生端 PWA（静态）+ 同域 API 反代
#
# 结构照抄 vpn.conf：80 保留（ACME 校验 + 过渡期 HTTP），443 全功能；
# 路由全部放 snippets/poetry-routes.conf，两处 include 共用。
# 上游 vpn_server（127.0.0.1:8888）已在 nginx.conf http{} 定义，见 deploy/README.md。

server {
    listen 80;
    listen [::]:80;
    server_name poetry.ok123find.top;

    # certbot webroot 校验用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 证书就绪、PWA 全量走 https 之后打开（sw.js 的注册要求安全上下文，尽快打开）：
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/poetry-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poetry.ok123find.top;

    # 与 vpn.conf 同一张 SAN 证书（deploy/ssl/*.sh 的 DOMAINS 已含 poetry.ok123find.top）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # PWA manifest 与图标
    location = /manifest.webmanifest {
        root /home/file/poetry/current/dist;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    include /etc/nginx/snippets/poetry-routes.conf;
}
