# /root/local/nginx-1.24.0/conf/server/poetry-sspacee.conf
# poetry.sspacee.com —— 唐诗产品学生端 PWA（静态）+ 同域 API 反代
#
# 拓扑（2026-11-22 定版）：sspacee.com 系域名 DNS A 记录 → 应用机 64.32.22.150，
# 由应用机 nginx 直接终结 TLS（每域一张 certbot 证书，同 jc.sspacee.com 惯例），
# **不经网关 8.217.122.83**。API 反代到本机 Java vvv-link :8888（内含 poetry/student 模块）。
#
# 本文件自包含（该机无 snippets 目录）；申请证书：deploy/ssl/certbot.sh（先加 DNS）。

server {
    listen 80;
    listen [::]:80;
    server_name poetry.sspacee.com;

    # certbot webroot 校验用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 证书就绪后打开（sw.js 注册要求安全上下文）：
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include server/poetry-routes-sspacee.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poetry.sspacee.com;

    # certbot.sh 签发的本域证书（与 sspacee.com/jc/gpt 同惯例：/etc/letsencrypt/live/<域>/）
    ssl_certificate     /etc/letsencrypt/live/poetry.sspacee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poetry.sspacee.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include server/poetry-routes-sspacee.conf;
}
