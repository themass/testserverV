# /etc/nginx/conf.d/vpn.conf
# api.ok123find.top / file.ok123find.top / api.sspacee.com
#
# 服务与域名规划（2026-11-24）：**Java 后端只有一个对外 API 域**（旧名
# api.ok123find.top 不变、新名 api.sspacee.com 同一路由别名），产品各自只拿
# 静态域（poetry.sspacee.com 等）。两条 server_name 共用同一个 snippets，
# 路径形状完全一致（`/vvv/api/**` 等），客户端换域名不用改代码。
#
# 结构：
#   - 80 端口：保留 HTTP，证书校验路径 + 原有路由（现在 App 仍用 http）
#   - 443 端口：HTTPS，路由与 80 完全一致（共用 snippets/vpn-routes.conf）
#   - 证书就绪并且 App 切到 https 后，打开文末的 301 跳转

# 原规则：Go-http-client 请求重定向到 Google
map $http_user_agent $is_go_client {
    default 0;
    ~*Go-http-client 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ok123find.top file.ok123find.top api.sspacee.com;

    # certbot webroot 校验用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    # 证书就绪、App 切到 https 之后，把下面三行的注释去掉，再 nginx -s reload：
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/vpn-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ok123find.top file.ok123find.top api.sspacee.com;

    # 同一张 SAN 证书覆盖三个名（certbot.sh 的 DOMAINS 已含 api.sspacee.com）；
    # 换证书后必须先 nginx -t——SAN 里没有 api.sspacee.com 时这个 vhost 会握手失败。
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    include /etc/nginx/snippets/vpn-routes.conf;
}
