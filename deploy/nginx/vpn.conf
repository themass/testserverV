# /etc/nginx/conf.d/vpn.conf
# api.ok123find.top / file.ok123find.top
#
# 结构：
#   - 80 端口：保留 HTTP，证书校验路径 + 原有路由（现在 App 仍用 http）
#   - 443 端口：HTTPS，路由与 80 完全一致（共用 snippets/vpn-routes.conf）
#   - 证书就绪并且 App 切到 https 后，打开文末的 301 跳转

# 原规则：Go-http-client 请求重定向到 Google
map $http_user_agent $is_go_client {
    default 0;
    ~*Go-http-client 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ok123find.top file.ok123find.top;

    # certbot webroot 校验用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    # 证书就绪、App 切到 https 之后，把下面三行的注释去掉，再 nginx -s reload：
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/vpn-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ok123find.top file.ok123find.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    include /etc/nginx/snippets/vpn-routes.conf;
}
