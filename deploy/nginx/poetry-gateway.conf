# /etc/nginx/conf.d/poetry-gateway.conf
# poetry.sspacee.com —— 唐诗学生端 PWA（静态）+ **同源** API 反代，落在**网关** 8.217.122.83
#
# 定案（2026-11-24 用户拍板：两个 sspacee 子域都指向网关）：
#   dig poetry.sspacee.com / api.sspacee.com @8.8.8.8 @1.1.1.1 @223.5.5.5 全部 → 8.217.122.83
#   实测网关对这两个名：80 → 404（无 vhost，落默认 server）、443 → 握手失败（证书 SAN 无此名）
#   ⇒ 本文件与 certbot 的 SAN 是剩下的两步，DNS 已经不用做了。
#
# 为什么静态也放网关（而不是应用机）：**API 与页面同源**，前端不用改基址、浏览器不涉及跨域，
# 所以宿主那个通配 CORS 缺口不再是唐诗上线的阻塞项（仍要修，见 docs/poetry/architecture.md）。
# Java 后端本身还在应用机（`vpn_server` 上游 = 应用机 :8888），网关只是多一个入口。
#
# 与旧文件的关系：`poetry-sspacee.conf` + `poetry-routes-sspacee.conf`（应用机终结 TLS 那一版）
# **降级为备选**——只有以后把 A 记录改回 64.32.22.150/104.160.191.87 时才用，两套别同时放。
#
# ⚠ 上线前必须先把 `poetry.sspacee.com` 加进证书 SAN（deploy/ssl/certbot.sh 的 DOMAINS 已加）。
#   只加 server_name 不换证书 = 这个 vhost 每次握手都失败，比没有更难看。
#
# ⚠ 放置路径先核实（两份仓库文档对网关 nginx 的记法不一致）：本仓库一直按
#   `/etc/nginx/conf.d/vpn.conf` 记（vpn.conf 文件头同），而 companion-agent 的
#   `scripts/nginx/README.md` 说网关 nginx 是源码编译的 `/root/local/nginx-1.24.0`、
#   站点在 `conf/server/*.conf`。放之前先跑一次：
#     nginx -T | grep -n "include\|vpn.conf"
#   conf.d 生效就按本文件头的两处路径放；若是 conf/server 那一套，本文件放
#   `conf/server/poetry-gateway.conf`，并把两处 include 改成
#   `conf/server/poetry-routes.conf`（snippets 目录可能根本不存在）。

server {
    listen 80;
    listen [::]:80;
    server_name poetry.sspacee.com;

    # certbot webroot 校验用（certbot.sh 就落在这台机上）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 证书就绪后打开（sw.js 注册要求安全上下文）：
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/poetry-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poetry.sspacee.com;

    # 网关只有一张证书（/etc/nginx/ssl/），SAN 由 certbot.sh 一次性带上所有名；
    # 与 vpn.conf 用同一对文件，续期钩子会一并覆盖，别在这里另指一处。
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/poetry-routes.conf;
}
