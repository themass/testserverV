# /root/local/nginx-1.24.0/conf/server/poetry-routes-sspacee.conf
# poetry.sspacee.com 的路由：静态 PWA + 同域 API（由 poetry-sspacee.conf 两处 include）
#
# API 前缀为后端实测 @RequestMapping，不带 /vvv、不 rewrite：
#   /api/student/v1/**  → vvv-student（jar 内模块，8888）
#   /api/poetry/v1/**   → vvv-poetry （jar 内模块，8888）
# 前端禁止写死域名，一律走同源相对路径。

# ---------- 静态 PWA（root 恒指 current/dist，回滚只翻软链，nginx 不动） ----------
location = /sw.js {
    root /home/file/poetry/current/dist;
    add_header Cache-Control "no-store" always;
}

location = /manifest.webmanifest {
    root /home/file/poetry/current/dist;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location /assets/ {
    root /home/file/poetry/current/dist;
    # 内容哈希资源：一年 immutable。若构建不产哈希，改这里再上线。
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    root /home/file/poetry/current/dist;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

# ---------- 同域 API ----------
location ^~ /api/student/v1/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 10m;
}

location ^~ /api/poetry/v1/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 读接口永不缓存；SSE 流必须关缓冲
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}
