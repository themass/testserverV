# /etc/nginx/snippets/poetry-api.conf
# 唐诗产品 API 反代（唯一一份 API 定义，两处 include）：
#   1) snippets/poetry-routes.conf（poetry.ok123find.top：API + 静态）
#   2) snippets/vpn-routes.conf 末尾（api.ok123find.top：Studio/BFF/脚本跨域入口）
# 上游 vpn_server（vvv-link:8888）已在 nginx.conf http{} 定义，见 deploy/README.md。
# @RequestMapping 实测前缀（2026-11-22）：
#   vvv-poetry:  /api/poetry/v1/**（含 /studio /review /draft /agent-orchestration）
#   vvv-student: /api/student/v1/**
# 路径原样转发，不 rewrite——后端本来就是这些前缀。

# ---------------------------------------------------------------------------
# API：Java（vvv-link:8888）。路径原样转发，不 rewrite——后端本来就是这些前缀。
# ---------------------------------------------------------------------------

# 学生端只读接口（已发布 Bundle）。内容随发布版本变化，缓存给 10 分钟兜底。
location ^~ /api/student/v1/ {
    default_type application/json;
    expires 10m;
    proxy_pass http://vpn_server;  # vvv-link:8888
}

# Studio 人类读写 + 草稿/评审/发布/媒体/agent 编排。
# 编排里有长任务（run 轮询/SSE 预留），读超时给 5 分钟，关缓冲防攒流。
location ^~ /api/poetry/v1/ {
    default_type application/json;
    expires -1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://vpn_server;  # vvv-link:8888
}

